<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="1500" height="900" fill="#12151c"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3a4256"/></marker></defs>
<text x="45" y="52" font-size="22" fill="#e8e6e3" font-weight="bold" text-anchor="start" font-family="Microsoft YaHei, sans-serif">情感三层时间架构（对照 2026-09 代码）</text><text x="45" y="76" font-size="12" fill="#b9c2cf" text-anchor="start" font-family="Microsoft YaHei, sans-serif">秒分钟 / 5-30 分 / 小时天 · 各配独立时间常数 · 别堆指标：每层只 2-4 参数，无数据保持中性</text>
<rect x="60" y="130" width="440" height="330" rx="10" fill="#1d222e" stroke="#6ea8d8" stroke-width="2"/>
<text x="280" y="176" font-size="19" fill="#e8e6e3" text-anchor="True" font-family="Microsoft YaHei, sans-serif">L1 对话情绪</text>
<text x="280" y="206" font-size="13" fill="#6ea8d8" text-anchor="True" font-family="Microsoft YaHei, sans-serif">秒 ~ 分钟</text>
<text x="280" y="250" font-size="12.5" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">对话冲击 VAD + 惰性指数衰减</text>
<text x="280" y="280" font-size="12.5" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">半衰 300s × 深度 × 唤醒 × 黏性</text>
<text x="280" y="326" font-size="12" fill="#6ea8d8" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">去向：Live2D 微表情 / 显著 L1 进 TTS 门控</text>
<text x="280" y="356" font-size="12" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">表现层：呼吸漂移 ±3% 低频正弦</text>
<text x="280" y="384" font-size="12" fill="#e07a6a" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">负向黏性：负面半衰 ×1.5</text>
<text x="280" y="412" font-size="12" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">OCEAN 调 6 向敏感度</text>
<rect x="530" y="130" width="440" height="330" rx="10" fill="#1d222e" stroke="#58c98a" stroke-width="2"/>
<text x="750" y="176" font-size="19" fill="#e8e6e3" text-anchor="True" font-family="Microsoft YaHei, sans-serif">L2 安静化</text>
<text x="750" y="206" font-size="13" fill="#58c98a" text-anchor="True" font-family="Microsoft YaHei, sans-serif">5 ~ 30 分钟</text>
<text x="750" y="250" font-size="12.5" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">唤醒自然下行，只压唤醒不动效价</text>
<text x="750" y="280" font-size="12.5" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3min / 15min / 2h → 0.25 / 0.12</text>
<text x="750" y="326" font-size="12" fill="#6ea8d8" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">去向：仅表现层（决策 PAD 零污染）</text>
<text x="750" y="356" font-size="12" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">表现层：呼吸漂移 ±3% 低频正弦</text>
<text x="750" y="384" font-size="12" fill="#e07a6a" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">负向黏性：负面半衰 ×1.5</text>
<text x="750" y="412" font-size="12" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">OCEAN 调 6 向敏感度</text>
<rect x="1000" y="130" width="440" height="330" rx="10" fill="#1d222e" stroke="#a98ae0" stroke-width="2"/>
<text x="1220" y="176" font-size="19" fill="#e8e6e3" text-anchor="True" font-family="Microsoft YaHei, sans-serif">L3 心情基调</text>
<text x="1220" y="206" font-size="13" fill="#a98ae0" text-anchor="True" font-family="Microsoft YaHei, sans-serif">小时 ~ 天</text>
<text x="1220" y="250" font-size="12.5" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">历史小时级 EMA 慢漂移基底</text>
<text x="1220" y="280" font-size="12.5" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">半衰 2h · 回落目标 = OCEAN 基线</text>
<text x="1220" y="326" font-size="12" fill="#6ea8d8" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">去向：决策注入 [心情基调] + 语气</text>
<text x="1220" y="356" font-size="12" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">表现层：呼吸漂移 ±3% 低频正弦</text>
<text x="1220" y="384" font-size="12" fill="#e07a6a" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">负向黏性：负面半衰 ×1.5</text>
<text x="1220" y="412" font-size="12" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">OCEAN 调 6 向敏感度</text>
<rect x="60" y="560" width="1380" height="200" rx="10" fill="#242b3a" stroke="#e8b34b" stroke-width="2"/>
<text x="750" y="602" font-size="17" fill="#e8b34b" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">表现与决策分离（程序不做语义判断）</text>
<text x="390" y="644" font-size="14" fill="#e8e6e3" text-anchor="True" font-family="Microsoft YaHei, sans-serif">L1 / L2 → 只进 Live2D 表现层</text>
<text x="390" y="674" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">「她看起来困」但思考不被污染</text>
<text x="1120" y="644" font-size="14" fill="#e8e6e3" text-anchor="True" font-family="Microsoft YaHei, sans-serif">L3 心情基调 → 事实进决策注入</text>
<text x="1120" y="674" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">「心情基调：平静」是读数，感受归她</text>
<text x="750" y="716" font-size="13" fill="#6ea8d8" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">程序只报数 · 体验判定与表达全归 LLM —— 代感受即越界</text>
</svg>
