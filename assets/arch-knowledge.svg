<text x="470" y="1050" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">检索结果供 探索判断 / 入口查重 / 对话引用 使用</text>
<text x="470" y="1076" font-size="#6ea8d8" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">探索信号中性记录（默认 0.5）· 成长柱真实回升</text>
