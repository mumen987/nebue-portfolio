<text x="470" y="846" font-size="16" fill="#e8b34b" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">⑤ 探索闭环 v3（知识库驱动）</text>
<text x="470" y="880" font-size="#6ea8d8" fill="13" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">探索前先查知识库：LLM 判 done / deepen / new</text>
<text x="470" y="910" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">已了解 → 自然转移 · 值得深挖 → 整页抓取 · 全新 → 基础探索</text>
