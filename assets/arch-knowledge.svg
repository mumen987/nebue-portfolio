<text x="40" y="50" font-size="22" fill="#e8e6e3" font-weight="bold" text-anchor="start" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">Nebue 知识管道 —— 清洗 · 入库 · 自净 · 闭环（2026-09）</text><text x="40" y="74" font-size="12" fill="#b9c2cf" text-anchor="start" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">先自净再向量化 · 双路检索 · 探索闭环</text>
<rect x="120" y="100" width="700" height="90" rx="10" fill="#1d222e" stroke="#3a4256" stroke-width="1.5"/>
<text x="470" y="136" font-size="16" fill="#e8b34b" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">① 知识来源</text>
<text x="470" y="166" font-size="#b9c2cf" fill="#b9c2cf" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">探索 snippet / deepen / 整页抓取 · 对话采集 · 工具发现</text>
<rect x="120" y="240" width="700" height="150" rx="10" fill="#1d222e" stroke="#6ea8d8" stroke-width="1.5"/>
<text x="470" y="276" font-size="16" fill="#e8b34b" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">② 知识清洗 knowledge_cleaner（三档灵活）</text>
<text x="470" y="310" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">light  — normalize + filter（探索 snippet ≤300 字）</text>
<text x="470" y="336" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">standard — normalize + filter + 质量评分（对话 / 工具发现）</text>
<text x="470" y="362" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">deepen — normalize + 评分 + 段落提取（整页正文）</text>
<text x="470" y="388" font-size="#e07a6a" fill="12" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">⛔ 闸门：乱码 / 超短 / 导航页 — 拦截不入库</text>
<rect x="120" y="440" width="700" height="130" rx="10" fill="#1d222e" stroke="#58c98a" stroke-width="1.5"/>
<text x="470" y="476" font-size="16" fill="#e8b34b" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">③ 入库（先自净 · 再向量化）</text>
<text x="470" y="510" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">① 同 title 查重 → 跳过（防重复）· 刷新访问</text>
<text x="470" y="536" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">② bge-m3 1024 维向量化 → embedding 列</text>
<text x="470" y="562" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">③ 入库 character_knowledge + 同步 character_memories_v2</text>
<rect x="120" y="620" width="700" height="140" rx="10" fill="#1d222e" stroke="#a98ae0" stroke-width="1.5"/>
<text x="470" y="656" font-size="16" fill="#e8b34b" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">④ 知识库 character_knowledge</text>
<text x="470" y="690" font-size="#6ea8d8" fill="13" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">双路检索：LIKE 关键词 + bge-m3 向量语义召回</text>
<text x="470" y="720" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">每日自净 kb.clean：同 title 去重 + LLM 批量判 keep / merge / delete</text>
<text x="470" y="744" font-size="#b9c2cf" fill="12.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" letter-spacing="0.5">自净先于向量化（顺序铁律）· JSON 备份 · 低分修剪</text>
